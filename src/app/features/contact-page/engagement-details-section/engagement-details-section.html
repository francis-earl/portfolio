<dl class="flex flex-col gap-6">
  <div class="flex gap-3">
    <ng-icon name="heroGlobeAlt" size="1.5rem" class="shrink-0" />
    <div class="flex flex-col gap-2">
      <dt class="font-bold text-stone-900">Currently Open To</dt>
      <dd>
        <ul class="list-disc pl-5 text-sm">
          <li class="font-semibold text-stone-900">Full-time opportunities</li>

        </ul>
      </dd>
    </div>
  </div>

  <div class="flex gap-3">
    <ng-icon name="heroClock" size="1.5rem" class="shrink-0" />
    <div class="flex flex-col gap-2">
      <dt class="font-bold text-stone-900">Response Time</dt>
      <dd class="text-sm">I usually respond within 24&ndash;48 hours.</dd>
    </div>
  </div>

  <div class="flex gap-3">
    <ng-icon name="heroMapPin" size="1.5rem" class="shrink-0" />

      <dd class="text-sm">Manila, Philippines</dd>

      <dt class="font-bold text-stone-900">Work Arrangement</dt>
      <dd class="text-sm">Open to hybrid and remote opportunities.</dd>
    </div>
  </div>

  <div class="flex gap-3">
    <ng-icon name="heroDocumentText" size="1.5rem" class="shrink-0" />
    <div class="flex flex-col gap-2">
      <dt class="font-bold text-stone-900">Resume</dt>
      <dd>
        <a
          href="/resume/Resume - Francis Earl Fojas.pdf"
          target="_blank"

          class="interactive-link text-sm text-amber-700"
