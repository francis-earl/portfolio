@let exp = experience();

<div class="flex gap-5">
  <a
    class="focus-ring h-fit shrink-0 rounded-xl"
    [href]="exp.website"
    target="_blank"
    rel="noopener noreferrer"
  >
    <img
      [src]="exp.logo"
      alt="{{ exp.company }} logo"
      class="interactive-image h-14 w-14 rounded-xl border border-stone-200"
    />
  </a>
  <div class="flex grow flex-col gap-4 md:gap-0.5">
    <div class="flex justify-between gap-2.5">
      <h3 class="font-bold text-stone-900">
        <a [href]="exp.website" target="_blank" rel="noopener noreferrer" class="interactive-link">
          {{ exp.company }}
        </a>
      </h3>
      @if (!exp.endDate) {
        <app-badge color="green" class="text-11 font-mono">Current</app-badge>
      }
    </div>
    <div class="flex flex-row flex-wrap items-center gap-0.5 text-sm md:gap-2.5 lg:gap-4">
      <h4 class="font-bold text-stone-900">{{ exp.role }}</h4>
      <span class="px-2 md:px-0">•</span>
      <p>{{ exp.employmentType }}</p>
      <span class="hidden md:inline-block">•</span>
      <p>{{ exp.location }}</p>
    </div>
    <p class="mt-2 max-w-2xl text-sm leading-normal font-medium text-stone-800 italic">
      {{ exp.overview }}
    </p>
  </div>
</div>
