@let exp = experience();

<article class="flex flex-col md:grid md:grid-cols-[74px_auto_1fr] md:gap-10">
  <div class="flex md:mt-9.5">
    <span class="mr-2 inline-block md:hidden">
      <ng-icon name="heroCalendarDateRange" size="1.1rem" />
    </span>
    <p class="md:text-13 font-mono text-sm font-medium md:whitespace-pre-line md:text-stone-500">
      {{ timeline() }}
    </p>
  </div>
  <div class="hidden md:relative md:flex md:justify-center md:self-stretch">
    <div class="absolute top-0 bottom-0 w-px bg-stone-300" aria-hidden="true"></div>
    <div
      class="absolute top-14 h-5 w-5 rounded-full border-2 border-amber-600"
      [class]="
        exp.endDate
          ? 'bg-white'
          : 'bg-amber-600 shadow-[0_0_0_6px_rgba(251,191,36,.12),0_0_20px_rgba(245,158,11,.30)]'
      "
      aria-hidden="true"
    ></div>
  </div>
  <app-card class="mt-2 mb-5 md:mt-5">
    <section class="flex flex-col gap-y-5">
      <experience-header [experience]="exp" />
      <hr class="border-stone-200" />
      <div class="ml-4 flex max-w-2xl flex-col gap-y-6 sm:ml-20">
        <experience-accomplishments [experience]="exp" />
        <app-tags [items]="exp.techStack" class="pb-1" />
      </div>
    </section>
  </app-card>
</article>
@if (!isLast()) {
  <hr class="mt-3 mb-8 block border-stone-300 md:hidden" />
}
