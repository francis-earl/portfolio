<section class="my-3 flex flex-col items-center justify-center gap-5 lg:mt-5 xl:mt-7 2xl:mt-12">
  <p class="text-11 font-mono tracking-widest text-stone-400 uppercase">
    {{ content.label }}
  </p>
  <h1
    class="bg-linear-to-r from-amber-700 via-amber-600 to-amber-500 bg-clip-text text-9xl font-semibold text-transparent"
  >
    {{ content.code }}
  </h1>
  <h2 class="text-center text-3xl font-bold text-stone-700">
    {{ content.title }}
  </h2>
  <p class="text-center text-stone-900">
    {{ content.message }}
  </p>
  <a
    [routerLink]="content.route"
    class="interactive-pressable mt-4 inline-flex items-center justify-center gap-2 rounded-lg border border-amber-400 bg-white px-4 py-2.5 text-sm font-medium text-amber-700"
  >
    <ng-icon name="heroArrowSmallLeft" size="16" />
    {{ content.action }}
  </a>
</section>
