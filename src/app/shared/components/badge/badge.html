<p
  class="inline-flex w-fit items-center gap-2.5 rounded-full border px-3 py-1 text-xs tracking-wide"
  [ngClass]="{
    'border-green-200 bg-green-50 text-green-700': color() === 'green',
    'border-orange-200 bg-orange-50 text-orange-700': color() === 'orange',
  }"
  [attr.aria-label]="ariaLabel()"
  role="status"
>
  <ng-content />
</p>
